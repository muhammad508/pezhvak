name: pezhvak
description: >-
  Watches incoming notifications and raises a full-screen alarm when a keyword,
  title, or monitored app matches. Android only.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Vendored with a one-line Gradle fix (see "Vendored plugin" in the README).
  notification_listener_service:
    path: ./notification_listener_service-0.3.4

  audioplayers: ^6.5.0
  file_picker: ^11.0.2
  flutter_local_notifications: ^19.5.0
  installed_apps: ^1.6.0
  myket_iap: ^1.1.10
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  restart_app: ^1.3.2
  shamsi_date: ^1.1.1
  shared_preferences: ^2.2.2
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  vibration: ^3.1.8
  volume_controller: ^3.7.1
  wakelock_plus: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The default alarm sound (assets/audio.mp3) is not part of this repository; see assets/README.md.
  assets:
    - assets/
